name: refresh

# Rebuilds the snapshot from Taskmarket's public API every hour and republishes
# GitHub Pages. This is the only thing that talks to the API; browsers never do.
on:
  # Backup only: the primary refresh is an hourly cron on the build host (minute 07).
  # Offsetting to :37 keeps the two writers from racing for the same push.
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pillow for the social card
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Build snapshot
        run: |
          node build.mjs
          python3 tools/og.py

      - name: Commit and push if the data moved
        run: |
          git config user.name  "taskmarket-live"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
